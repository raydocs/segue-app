name: CI

on:
  pull_request:
  push:
    branches: [main, "quick/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode on the image
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+)(_[^/]*)?\.app/\1 &/' | sort -V | tail -n 1 | cut -d' ' -f2)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Build and test
        run: cd apps/macos && swift build && swift test

  # Same tests with the newest toolchain we ship with (Xcode 27, Swift 6.4) on the
  # owner's Mac mini. Hosted macOS images stop at Xcode 26.6 / Swift 6.3, which
  # the job above keeps covering. Never runs code from a fork on this machine.
  macos-xcode27:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, segue-mac-xcode27]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build and test
        run: cd apps/macos && swift build && swift test

